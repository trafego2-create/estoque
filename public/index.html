<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Brabo Estoque</title>
<meta name="description" content="Controle dos equipamentos internos da Brabo: o que existe e com quem está.">
<meta name="theme-color" content="#1f2330">
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="apple-touch-icon" href="/icone.png">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@400;500;600;700&display=swap">
<style>
/* Cores e fontes da Brabo (as mesmas do Brabo Send e do Brabo Links).
   Layout pensado para a mão: abas no rodapé, campos altos, nada de tabela larga. */
:root{
  --bg:#f1f3f5; --surface:#fff; --surface-2:#f6f7fb; --line:#e5e7eb; --line-strong:#d1d5db;
  --fg:#1f2330; --muted:#6b7280; --accent:#ef3b24; --accent-fg:#fff; --accent-soft:#fdeeeb;
  --ok:#1f8a4c; --ok-soft:#e9f8ef; --warn:#a15c00; --warn-soft:#fff6dd;
  --bad:#c62828; --bad-soft:#fdecec; --info:#2f5ee3; --info-soft:#eef3ff; --neutral-soft:#eef0f3;
  --barra:#1f2330; --barra-2:#2b3040; --barra-fg:#fff; --barra-muted:rgba(255,255,255,.64);
  --barra-line:rgba(255,255,255,.2); --shadow:0 20px 60px rgba(20,26,52,.18);
  --font-display:"Archivo Black","Inter",system-ui,sans-serif;
  --font-body:"Inter","Segoe UI",system-ui,-apple-system,Roboto,sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
  --r:10px; color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#1a1a1a; --surface:#262626; --surface-2:#2e2e2e; --line:#3a3a3a; --line-strong:#484848;
  --fg:#f2f2f2; --muted:#a3a3a3; --accent:#ff6a4d; --accent-fg:#1a1a1a; --accent-soft:#2b2118;
  --ok:#34d17a; --ok-soft:#1c2e22; --warn:#f4b740; --warn-soft:#332a16;
  --bad:#ff5c5c; --bad-soft:#331e1e; --info:#8fb0ff; --info-soft:#1b2440; --neutral-soft:#303030;
  --barra:#141414; --barra-2:#1e1e1e; --shadow:0 20px 60px rgba(0,0,0,.55); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1a1a1a; --surface:#262626; --surface-2:#2e2e2e; --line:#3a3a3a; --line-strong:#484848;
  --fg:#f2f2f2; --muted:#a3a3a3; --accent:#ff6a4d; --accent-fg:#1a1a1a; --accent-soft:#2b2118;
  --ok:#34d17a; --ok-soft:#1c2e22; --warn:#f4b740; --warn-soft:#332a16;
  --bad:#ff5c5c; --bad-soft:#331e1e; --info:#8fb0ff; --info-soft:#1b2440; --neutral-soft:#303030;
  --barra:#141414; --barra-2:#1e1e1e; --shadow:0 20px 60px rgba(0,0,0,.55); color-scheme:dark}

*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font:15px/1.5 var(--font-body);
  -webkit-text-size-adjust:100%;overscroll-behavior-y:contain}
[hidden]{display:none!important}
h1,h2,h3{margin:0;text-wrap:balance}
h1{font-family:var(--font-display);font-weight:400;font-size:1.05rem;letter-spacing:-.01em}
h2{font-size:1.15rem;font-weight:700} h3{font-size:.98rem;font-weight:700}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.dentro{max-width:820px;margin:0 auto;
  padding-left:max(14px,env(safe-area-inset-left,0px));
  padding-right:max(14px,env(safe-area-inset-right,0px))}

/* topo */
.topo{position:sticky;top:0;z-index:20;background:var(--barra);color:var(--barra-fg);
  border-bottom:3px solid var(--accent);padding-top:env(safe-area-inset-top,0px)}
.topo .dentro{display:flex;align-items:center;justify-content:space-between;gap:10px;
  min-height:52px;padding-block:8px}
.topo h1{color:var(--barra-fg)}
.marca{display:flex;align-items:center;gap:10px;min-width:0}
.marca .selo{font-family:var(--font-mono);font-size:.68rem;padding:2px 7px;border-radius:999px;
  background:var(--barra-2);color:var(--barra-muted)}
.topo-botoes{display:flex;align-items:center;gap:6px}
.icone-btn{background:var(--barra-2);border:1px solid var(--barra-line);color:var(--barra-fg);
  border-radius:999px;min-width:38px;height:38px;padding:0 10px;cursor:pointer;font-size:.85rem}
.pendentes{background:var(--warn-soft);color:var(--warn);border:0;font-weight:600}

/* conteúdo */
main{padding:14px 0 86px}
.secao{display:flex;flex-direction:column;gap:12px}
.cartao{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.rotulo{font-size:.7rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}

/* resumo */
.numeros{display:grid;grid-template-columns:repeat(auto-fit,minmax(104px,1fr));gap:8px}
.numero{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;
  text-align:left;cursor:pointer}
.numero[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.numero b{display:block;font-size:1.5rem;font-weight:700;line-height:1.1;font-family:var(--font-mono)}
.numero span{font-size:.78rem;color:var(--muted)}

/* busca e filtros */
.busca{display:flex;gap:8px}
.busca input{flex:1}
input,select,textarea{width:100%;background:var(--surface);border:1px solid var(--line-strong);
  border-radius:var(--r);padding:12px;font-size:16px}
textarea{min-height:72px;resize:vertical}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;background:var(--surface);border:1px solid var(--line-strong);border-radius:999px;
  padding:7px 13px;font-size:.88rem;cursor:pointer;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}

/* lista */
.lista{display:flex;flex-direction:column;gap:8px}
.item{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);
  border-radius:var(--r);padding:12px;width:100%;text-align:left;cursor:pointer}
.item:active{transform:scale(.995)}
.item-corpo{flex:1;min-width:0}
.item-topo{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.item-topo strong{font-size:1rem}
.pat{font-family:var(--font-mono);font-size:.78rem;background:var(--neutral-soft);
  border-radius:6px;padding:1px 6px;color:var(--muted)}
.linha2{font-size:.86rem;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tag{font-size:.74rem;font-weight:600;border-radius:999px;padding:3px 9px;white-space:nowrap}
.t-estoque{background:var(--info-soft);color:var(--info)}
.t-pessoa{background:var(--ok-soft);color:var(--ok)}
.t-manutencao{background:var(--warn-soft);color:var(--warn)}
.t-baixado{background:var(--neutral-soft);color:var(--muted)}
.t-emprestado{background:var(--accent-soft);color:var(--accent)}
.vazio{text-align:center;color:var(--muted);padding:28px 10px}

/* grupos (pessoas) */
.grupo{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.grupo>summary{display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:13px 14px;cursor:pointer;list-style:none}
.grupo>summary::-webkit-details-marker{display:none}
.grupo .itens{border-top:1px solid var(--line);padding:8px;display:flex;flex-direction:column;gap:8px;
  background:var(--surface-2)}
.conta-itens{font-family:var(--font-mono);font-size:.78rem;background:var(--neutral-soft);
  border-radius:999px;padding:2px 9px;color:var(--muted)}

/* formulário */
.campo{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
.campo>label{font-size:.8rem;font-weight:600;color:var(--muted)}
.duplo{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{border:0;border-radius:var(--r);padding:14px 16px;font-weight:600;font-size:1rem;cursor:pointer;
  background:var(--accent);color:var(--accent-fg);width:100%}
.btn.secundario{background:var(--surface);border:1px solid var(--line-strong);color:var(--fg)}
.btn.fantasma{background:transparent;border:1px solid var(--line-strong)}
.btn.perigo{background:var(--bad-soft);color:var(--bad);border:1px solid var(--bad)}
.btn:disabled{opacity:.55}
.acoes-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}

/* abas no rodapé */
.rodape{position:fixed;bottom:0;left:0;right:0;z-index:25;background:var(--surface);
  border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.rodape .dentro{display:flex;justify-content:space-around;gap:4px;padding:6px 8px}
.rodape button{flex:1;background:transparent;border:0;border-radius:var(--r);padding:8px 4px;
  display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--muted);cursor:pointer;
  font-size:.72rem;font-weight:600}
.rodape button[aria-current="true"]{color:var(--accent);background:var(--accent-soft)}
.rodape svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.9;
  stroke-linecap:round;stroke-linejoin:round}

/* painel (detalhe / formulários) */
.fundo{position:fixed;inset:0;z-index:40;background:rgba(10,12,20,.55);display:flex;
  align-items:flex-end;justify-content:center}
.painel{background:var(--surface);width:100%;max-width:820px;max-height:92vh;overflow-y:auto;
  border-radius:16px 16px 0 0;box-shadow:var(--shadow);
  padding:16px max(14px,env(safe-area-inset-left,0px)) calc(20px + env(safe-area-inset-bottom,0px))}
.painel-topo{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;
  margin-bottom:14px;position:sticky;top:-16px;background:var(--surface);padding-top:4px;z-index:1}
.fechar{background:var(--neutral-soft);border:0;border-radius:999px;width:34px;height:34px;
  font-size:1.1rem;cursor:pointer;flex:none;color:var(--fg)}
.dados{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:.92rem;margin:12px 0}
.dados dt{color:var(--muted);font-size:.84rem}
.dados dd{margin:0;overflow-wrap:anywhere}
.hist{display:flex;flex-direction:column;gap:8px;margin-top:6px}
.hist li{list-style:none;border-left:2px solid var(--line-strong);padding:0 0 0 10px;font-size:.88rem}
.hist ul{margin:0;padding:0}

/* avisos */
#aviso{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(86px + env(safe-area-inset-bottom,0px));
  z-index:60;background:var(--fg);color:var(--bg);padding:11px 16px;border-radius:999px;
  font-size:.9rem;font-weight:600;max-width:92vw;text-align:center;box-shadow:var(--shadow)}
#aviso.erro{background:var(--bad);color:#fff}
.faixa{background:var(--warn-soft);color:var(--warn);border:1px solid var(--warn);
  border-radius:var(--r);padding:10px 12px;font-size:.88rem;font-weight:500}

/* login */
.login{min-height:100vh;display:grid;place-items:center;padding:24px}
.login form{width:100%;max-width:360px;background:var(--surface);border:1px solid var(--line);
  border-radius:var(--r);padding:22px}
.login h1{font-size:1.4rem;margin-bottom:4px}
@media (min-width:720px){
  .duplo{grid-template-columns:1fr 1fr}
  .fundo{align-items:center}
  .painel{border-radius:16px;max-height:86vh}
}
</style>
</head>
<body>

<!-- login -->
<section class="login" id="tela-login" hidden>
  <form id="form-login">
    <h1>Brabo Estoque</h1>
    <p class="muted" style="margin-bottom:18px">Equipamentos internos da empresa.</p>
    <div class="campo">
      <label for="login-email">E-mail</label>
      <input id="login-email" type="email" autocomplete="username" required>
    </div>
    <div class="campo">
      <label for="login-senha">Senha</label>
      <input id="login-senha" type="password" autocomplete="current-password" required>
    </div>
    <button class="btn" type="submit">Entrar</button>
    <p id="login-erro" class="muted" style="margin-top:12px;color:var(--bad)" hidden></p>
  </form>
</section>

<!-- app -->
<div id="tela-app" hidden>
  <header class="topo">
    <div class="dentro">
      <div class="marca">
        <h1>Brabo Estoque</h1>
        <span class="selo" id="selo-usuario"></span>
      </div>
      <div class="topo-botoes">
        <button class="icone-btn pendentes" id="btn-pendentes" hidden></button>
        <button class="icone-btn" id="btn-recarregar" title="Atualizar" aria-label="Atualizar">↻</button>
        <button class="icone-btn" id="btn-menu" title="Mais opções" aria-label="Mais opções">⋯</button>
      </div>
    </div>
  </header>

  <main class="dentro">
    <section class="secao" id="aba-estoque"></section>
    <section class="secao" id="aba-pessoas" hidden></section>
    <section class="secao" id="aba-registrar" hidden></section>
    <section class="secao" id="aba-historico" hidden></section>
  </main>

  <nav class="rodape">
    <div class="dentro">
      <button data-aba="estoque" aria-current="true">
        <svg viewBox="0 0 24 24"><path d="M3 7l9-4 9 4v10l-9 4-9-4z"/><path d="M3 7l9 4 9-4M12 11v10"/></svg>
        Estoque
      </button>
      <button data-aba="pessoas">
        <svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.2"/><path d="M3.5 20c0-3 2.5-5 5.5-5s5.5 2 5.5 5"/><path d="M16 11.5a3 3 0 100-6M18 20c0-2.2-.9-3.9-2.3-5"/></svg>
        Pessoas
      </button>
      <button data-aba="registrar">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/></svg>
        Registrar
      </button>
      <button data-aba="historico">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.5 2"/></svg>
        Histórico
      </button>
    </div>
  </nav>
</div>

<div id="area-painel"></div>
<div id="aviso" hidden></div>

<script src="/app.js"></script>
</body>
</html>
